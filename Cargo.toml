[package]

authors = ["Antonio Spadaro <git@ilovelinux.dev>"]
name = "grammers-stringsession"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Export/restore a grammers session as a portable base64 string."
repository = "https://codeberg.org/ilovelinux/grammers-stringsession"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["telegram", "grammers", "session", "mtproto", "base64"]
categories = ["api-bindings", "encoding", "authentication"]
publish = true

[dependencies]
base64 = "0.21"
grammers-session = { version = "0.9.0", features = ["serde"], default-features = false }
postcard = { version = "1.0.8", features = ["use-std"], default-features = false }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread"] }
tokio-test = "0.4.5"
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }

[[bench]]
name = "main_benchmark"
harness = false

[lints.clippy]
cargo = "deny"
complexity = "deny"
correctness = "deny"
nursery = "deny"
pedantic = "deny"
perf = "deny"
style = "deny"
suspicious = "deny"

multiple_crate_versions = { level = "allow", priority = 1 }
